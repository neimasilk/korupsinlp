                          - cell "Enter Comments" [ref=f7e40]:
                            - textbox "Enter Comments" [ref=f7e41]: "Dear Editor, We submit for your consideration our manuscript entitled \"Charge Type, Judicial Opacity, and the Limits of Prediction: A Computational Analysis of Indonesian Corruption Sentences\" for publication in Crime, Law and Social Change. This study presents the first large-scale computational analysis of Indonesian corruption sentencing, using a novel corpus of 671 Supreme Court verdicts. We report three principal findings: 1. Charge type is independently associated with sentencing severity. After controlling for prosecution demand, cases classified under Pasal 2 (enrichment) of Indonesia's Anti-Corruption Law receive sentences 0.73 years longer than equivalent Pasal 3 (authority abuse) cases (b=0.730, p=0.002, Cohen's d=0.58). This association is temporally stable (pre-2024 and post-2024, interaction p=0.94) and is detected through text analysis of judicial reasoning rather than structured case metadata. 2. The sentencing discount is opaque from public documents. The ratio of sentence to prosecution demand (mean 0.78) cannot be predicted from any available feature (R2=-0.01), suggesting that approximately 40% of sentencing variance reflects factors not recoverable from published verdicts. 3. Text mining approaches systematically fail to improve sentencing prediction at this corpus size, a negative result documented across 30+ experiments with TF-IDF, transformer embeddings, and domain-specific features. We believe this manuscript fits well within the scope of Crime, Law and Social Change for several reasons: it addresses corruption sentencing -- a core topic of the journal -- using rigorous quantitative methods applied to a novel Southeast Asian dataset. The findings have direct policy implications for anti-corruption reform, judicial transparency, and sentencing consistency monitoring in Indonesia. The manuscript has not been submitted elsewhere. Code and data are available for reproducibility. A preprint version has been posted on SSRN (Abstract ID: 6574140). In accordance with Springer Nature's policy on AI-assisted tools, I disclose that Claude (Anthropic) was used as a computational research assistant for programming, literature search, and manuscript drafting. All analyses were independently verified through reproducible scripts, and I take full responsibility for all scientific claims and interpretations. Full details are provided in the Declarations section of the manuscript. Sincerely, Mukhlis Amien Department of Informatics, Universitas Bhinneka Nusantara, Malang, Indonesia Email: amien@ubhinus.ac.id ORCID: 0000-0002-1848-167X"
