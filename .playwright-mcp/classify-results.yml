              - 'row "Law & Society: Public Law - Crime, Criminal Law, & Punishment eJournal This area includes content of empirical or theoretical scholarship on topics related to crime, criminal law, and criminal punishment (including the death penalty), from any disciplinary perspective. Covered topics include victims'' rights, criminal sentencing rules, criminal sentencing procedures, criminal punishment, theories of criminal punishment, alternatives to traditional criminal punishment, criminal law doctrine, and administration of criminal justice.Editor: Jessica Eaglin, Indiana University" [ref=e767] [cursor=pointer]':
                - cell [ref=e768]
                - 'cell "Law & Society: Public Law - Crime, Criminal Law, & Punishment eJournal" [ref=e770]'
                - 'cell "This area includes content of empirical or theoretical scholarship on topics related to crime, criminal law, and criminal punishment (including the death penalty), from any disciplinary perspective. Covered topics include victims'' rights, criminal sentencing rules, criminal sentencing procedures, criminal punishment, theories of criminal punishment, alternatives to traditional criminal punishment, criminal law doctrine, and administration of criminal justice.Editor: Jessica Eaglin, Indiana University" [ref=e776]'
              - 'row "Criminology eJournal >Note: Works that appear in this Criminology eJournal typically are not eligible for inclusion in the Criminal Law or Criminal Procedure eJournals. This area includes content in the field of criminology broadly understood. Topics include but are not limited to the causes, consequences, and prevention of crime; the impact of criminal laws and their enforcement; the functioning of criminal-law-enforcement institutions; the political economy of criminal lawmaking and enforcement; and the relationship between the criminal justice system and other social institutions. Works of diverse perspectives and methods are welcome so long as they are scholarly in nature.Note: Works that appear in this Criminology eJournal typically are not eligible for inclusion in the Criminal Law or Criminal Procedure eJournals. Editor: Paul H. Robinson, University of Pennsylvania" [ref=e795] [cursor=pointer]':
                - cell [ref=e796]
                - cell "Criminology eJournal" [ref=e798]
                - 'cell ">Note: Works that appear in this Criminology eJournal typically are not eligible for inclusion in the Criminal Law or Criminal Procedure eJournals. This area includes content in the field of criminology broadly understood. Topics include but are not limited to the causes, consequences, and prevention of crime; the impact of criminal laws and their enforcement; the functioning of criminal-law-enforcement institutions; the political economy of criminal lawmaking and enforcement; and the relationship between the criminal justice system and other social institutions. Works of diverse perspectives and methods are welcome so long as they are scholarly in nature.Note: Works that appear in this Criminology eJournal typically are not eligible for inclusion in the Criminal Law or Criminal Procedure eJournals. Editor: Paul H. Robinson, University of Pennsylvania" [ref=e803]'
              - 'row "Criminal Procedure eJournal Note: Works that appear in this Criminal Procedure eJournal typically are not eligible for inclusion in the Criminal Law or Criminology eJournals. This area includes content relating to criminal procedure. Topics include but are not limited to assessments of rules of criminal procedure and evidence; proposals for repeal or reform of rules of criminal procedure and evidence; investigations of the interaction of legislatures, juries, courts and other institutions in the formation of rules of criminal procedure and evidence; examinations of the functions of courts, juries, prosecutors, and defense lawyers in criminal adjudication; and evaluations of how rules of criminal and procedure interact with criminal investigations and police functions generally." [ref=e827] [cursor=pointer]':
                - cell [ref=e828]
                - cell "Criminal Procedure eJournal" [ref=e830]
                - 'cell "Note: Works that appear in this Criminal Procedure eJournal typically are not eligible for inclusion in the Criminal Law or Criminology eJournals. This area includes content relating to criminal procedure. Topics include but are not limited to assessments of rules of criminal procedure and evidence; proposals for repeal or reform of rules of criminal procedure and evidence; investigations of the interaction of legislatures, juries, courts and other institutions in the formation of rules of criminal procedure and evidence; examinations of the functions of courts, juries, prosecutors, and defense lawyers in criminal adjudication; and evaluations of how rules of criminal and procedure interact with criminal investigations and police functions generally." [ref=e835]'
