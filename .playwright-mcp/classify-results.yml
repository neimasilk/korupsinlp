              - 'row "Discrimination, Law & Justice eJournal This area includes content dealing with issues of discrimination, equality, minority rights and subordination, from both critical and noncritical perspectives. We seek projects that examine how law and policy interplay with specific social groups or identities, and how the processes of formal democracy interplay with existing or traditional structures and systems of exclusion or hierarchy. We specifically welcome abstracts and papers that are empirical and/or interdisciplinary in nature, that connect law to society, or that link the domestic to the international, written from a variety of theoretical perspectives.Editor: Francisco (Frank) Valdes, University of Miami" [ref=e615] [cursor=pointer]':
                - cell [ref=e616]
