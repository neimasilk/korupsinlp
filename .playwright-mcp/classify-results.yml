                - 'cell "This area includes content dealing with issues of discrimination, equality, minority rights and subordination, from both critical and noncritical perspectives. We seek projects that examine how law and policy interplay with specific social groups or identities, and how the processes of formal democracy interplay with existing or traditional structures and systems of exclusion or hierarchy. We specifically welcome abstracts and papers that are empirical and/or interdisciplinary in nature, that connect law to society, or that link the domestic to the international, written from a variety of theoretical perspectives.Editor: Francisco (Frank) Valdes, University of Miami" [ref=e624]'
              - row "Criminal Justice Education eJournal This area is designed for the sharing of teaching materials in criminal justice. All materials related to criminal justice are encouraged. This includes casebooks, reviews of casebooks, lecture notes, class summaries, outlines, supplementary materials (for your own or someone else's book), syllabi, problems sets, PowerPoint presentations, videos, and other teaching materials." [ref=e641] [cursor=pointer]:
