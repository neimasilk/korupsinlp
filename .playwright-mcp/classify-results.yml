                - cell "This area includes content on the application of various sciences to answer questions relating to the examination and comparison of biological evidence, trace evidence, impression evidence (such as fingerprints, footwear impressions, and tire tracks), controlled substances, ballistics, firearm and toolmark examination, and other evidence in criminal investigations." [ref=e666]
              - row "Criminal Law, Courts & Procedure eJournal This area includes content that focuses on the administration of the criminal justice system. In particular, this scholarship examines issues related to criminal courts and legal processes within the criminal justice system. Such issues include operations, strategies, and evaluations of a variety of courts and court actors. We are interested in criminal courts of all types and levels, including both state and federal criminal court systems." [ref=e675] [cursor=pointer]:
