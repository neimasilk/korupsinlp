              - row "Criminalistics eJournal This area includes content on the application of various sciences to answer questions relating to the examination and comparison of biological evidence, trace evidence, impression evidence (such as fingerprints, footwear impressions, and tire tracks), controlled substances, ballistics, firearm and toolmark examination, and other evidence in criminal investigations." [ref=e657] [cursor=pointer]:
