            - generic "Abstract" [ref=e277]: "Does the punishment fit the crime in corruption cases? We estimate the elasticity of prosecution demands (tuntutan) with respect to state financial loss (kerugian negara) using 291 Indonesian Supreme Court corruption verdicts. The elasticity is 0.109 (bootstrap 95% CI [0.078, 0.148]): a 100-fold increase in state loss produces only a 1.7-fold increase in the prosecution demand. A Rp 10 million case draws a demand of 3.2 years; a Rp 100 billion case-ten thousand times the harm-draws 8.8 years. Prosecution demands are also less predictable than sentences (R-squared=0.315 vs 0.600), meaning prosecutors exercise wider discretion than judges. Demands have risen over time (from roughly 5 years in 2014 to 7.5 years in 2025) while the sentencing discount has held steady at about 22%. Geographic variation disappears after controlling for case magnitude. The near-zero elasticity means the marginal expected punishment for escalating corruption is negligible-the system implicitly discounts large-scale theft."
