            - paragraph [ref=e273]: Medicine is a broad field within the health sciences discipline that encompasses medical education; research on infectious diseases, illnesses, and health conditions; clinical practice, diagnostic assessments, diagnoses, treatments, and health outcomes. The Medical Research Network on SSRN is an open access preprint server that provides a venue for authors to showcase their research papers in medicine in our research community, speeding up dissemination and providing the scientific community access to groundbreaking working papers, early-stage research, clinical research, and even peer reviewed or published journal articles.
        - button "Computer Science Research Network Computer Science is the study of computer systems and the impact that design, theory, and development have on society. The Computer Science Research Network on SSRN is an open access preprint server that provides a venue for authors to showcase their research papers in our digital library, speeding up the dissemination and providing the scholarly community access to groundbreaking working papers, early stage research and even peer reviewed or published journal articles. SSRN provides the opportunity to share different outputs of research such as preprints, preliminary or exploratory investigations, book chapters, PhD dissertations, course and teaching materials, presentations, and posters among others." [ref=e274] [cursor=pointer]:
