      - generic [ref=e253]:
        - button "Economics Research Network The study of economics looks at the impact of consumption, savings, investment and production on economic growth. The Economics Research Network on SSRN is an open access preprint server that provides a venue for authors to showcase their research papers in economics in our digital library, speeding up dissemination and providing the scholarly community access to groundbreaking working papers, early stage research and even peer reviewed or published journal articles." [ref=e254] [cursor=pointer]:
          - generic [ref=e256]:
            - heading "Economics Research Network" [level=3] [ref=e257]:
              - link "Economics Research Network" [ref=e258]:
                - /url: https://www.ssrn.com/index.cfm/en/ern/
                - generic [ref=e260]: Economics Research Network
            - paragraph [ref=e263]: The study of economics looks at the impact of consumption, savings, investment and production on economic growth. The Economics Research Network on SSRN is an open access preprint server that provides a venue for authors to showcase their research papers in economics in our digital library, speeding up dissemination and providing the scholarly community access to groundbreaking working papers, early stage research and even peer reviewed or published journal articles.
        - button "Medical Research Network Medicine is a broad field within the health sciences discipline that encompasses medical education; research on infectious diseases, illnesses, and health conditions; clinical practice, diagnostic assessments, diagnoses, treatments, and health outcomes. The Medical Research Network on SSRN is an open access preprint server that provides a venue for authors to showcase their research papers in medicine in our research community, speeding up dissemination and providing the scientific community access to groundbreaking working papers, early-stage research, clinical research, and even peer reviewed or published journal articles." [ref=e264] [cursor=pointer]:
          - generic [ref=e266]:
