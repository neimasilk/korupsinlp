          - generic [ref=e132]:
            - paragraph [ref=e133]:
              - emphasis [ref=e134]: Crime, Law and Social Change
              - text: "is a hybrid journal. Once the article is accepted for publication, authors will have the option to choose how their article is published:"
            - list [ref=e135]:
              - listitem [ref=e136]:
                - text: Subscription publishing model – published articles are made available to institutions and individuals who subscribe to
                - emphasis [ref=e137]: Crime, Law and Social Change
                - text: or who pay to read specific articles.
              - listitem [ref=e138]: Open access – when an article is accepted for publication, the author/s or funder/s pay an article processing charge (APC). The final version of the published article is then free to read for everyone.
            - paragraph [ref=e139]:
              - text: Authors may need to take specific actions to achieve compliance with funder and institutional open access mandates. Some funders, for example
              - link "NIH" [ref=e140] [cursor=pointer]:
                - /url: https://www.springernature.com/gp/open-science/us-federal-agency-compliance
              - text: or
              - link "Plan S members" [ref=e141] [cursor=pointer]:
                - /url: https://www.springernature.com/gp/open-science/plan-s-compliance
              - text: ", require you to make your article immediately accessible on publication. You will need to select open access publication to comply when publishing with Springer Nature, we will help you choose the correct route where possible. If you select the subscription publishing route, you accept the journal’s standard licensing terms. This route isn’t suitable if your funders require immediate access (for example"
              - link "NIH" [ref=e142] [cursor=pointer]:
                - /url: https://www.springernature.com/gp/open-science/us-federal-agency-compliance
              - text: or
              - link "Plan S" [ref=e143] [cursor=pointer]:
                - /url: https://www.springernature.com/gp/open-science/plan-s-compliance
              - text: ). This is because subscription authors must warrant that they haven’t already committed to terms inconsistent with our licensing agreement, including the
              - link "embargo period" [ref=e144] [cursor=pointer]:
                - /url: https://www.springernature.com/gp/open-science/policies/journal-policies/licensing-and-copyright
              - text: .
            - heading "Benefits of open access" [level=4] [ref=e145]
            - paragraph [ref=e146]: "Publishing open access (OA) offers a number of benefits, including greater reach and readership for your work:"
            - list [ref=e147]:
