          - heading "Creative Commons licences" [level=3] [ref=e202]
          - paragraph [ref=e203]: Open access articles in Springer Nature journals are published under Creative Commons licences. These provide an industry-standard framework to support easy re-use of open access material. Under Creative Commons licences, authors retain copyright of their articles.
