              - text: is £2690.00 GBP / $3690.00 USD / €2990.00 EUR.
            - paragraph [ref=e179]: This fee is subject to VAT or local taxes where applicable.
            - paragraph [ref=e180]:
              - text: Visit
              - link "our open access support portal" [ref=e181] [cursor=pointer]:
